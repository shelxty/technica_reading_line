<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Line setup</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px;
      color: #1f2328; background: #fff; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; background: #0969da; color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; }
    .ok { color: #1a7f37; font-weight: 600; }
    .err { color: #cf222e; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      .ok { color: #3fb950; } .err { color: #ff7b72; }
    }
  </style>
</head>
<body>
  <h1>Allow camera access</h1>
  <p>Reading Line uses your webcam to follow your hand. Video never leaves your computer —
    the hand tracking runs locally inside the extension.</p>
  <p>Chrome only lets the extension ask for the camera from a normal tab, so click below and
    choose <b>Allow</b>. You only need to do this once.</p>
  <button id="allow">Allow camera</button>
  <p id="msg"></p>
  <script src="setup.js"></script>
</body>
</html>
